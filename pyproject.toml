[project]
name = "block-cascade"
version = "3.3.0"
description = "Library for model training in multi-cloud environment."
readme = "README.md"
authors = [{name = "Block"}]
requires-python = ">=3.9,<3.15"
dependencies = [
    "cloudml-hypertune==0.1.0.dev6",
    "cloudpickle>=2.0,<4.0",
    "databricks-cli>=0.17.7",
    "gcsfs>=2024",
    "google-auth>=2.23.2,<3",
    "google-cloud-aiplatform>=1.39.0,<2",
    "google-cloud-monitoring>=2.16.0,<3",
    "google-cloud-resource-manager>=1.10.4,<2",
    "prefect>=2.0,<4.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "s3fs>=2024",
]

[project.optional-dependencies]
torch = [
    "torch>=1.13.1",
    "torchvision>=0.14.1",
]

[project.scripts]
cascade = "block_cascade.cli:cli"

[dependency-groups]
dev = [
    "pytest>=7.3.1",
    "pytest-env>=0.8.1,<1",
    "pytest-mock>=3.11.1,<4",
    "dask[distributed]>=2022",
    "pyfakefs<5.3",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["block_cascade*"]
exclude = ["assets*"]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
